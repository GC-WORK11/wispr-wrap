<!doctype html>
<!-- oldtest — drives the MERGED app shell against stub_wfd.py --old
     (a daemon that predates sign control: /bank,/teach,/act all 404).

     Asserts the honest degraded states, not fake success:
       · signs sheet shows the "older wrap" banner after /bank 404s
       · teach sheet shows the same honest banner instead of a wizard
       · the composer still works (text send lane is daemon-age-proof)
     Posts {pass,errs,steps} to /_result?f=old. -->
<html><head><meta charset="utf-8"><title>old-daemon selftest</title>
<style>body{font:13px ui-monospace,monospace;padding:18px;background:#f4f5f8;color:#0f172a}
#result{font-size:16px;font-weight:700;margin-bottom:10px}
#log{white-space:pre-wrap;color:#64748b}iframe{width:390px;height:760px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}</style>
</head><body>
<div id="result">RUNNING</div>
<div id="log"></div>
<iframe id="fr" src="/index.html?k=teach-stub-key#/signs"></iframe>
<script>
const KEY = 'teach-stub-key', logEl = document.getElementById('log'), resEl = document.getElementById('result');
const errs = [], steps = [];
const fr = document.getElementById('fr');
const win = fr.contentWindow;
const log = m => { steps.push(m); logEl.textContent += m + '\n'; };
win.addEventListener('error', e => errs.push('iframe: ' + e.message));
win.addEventListener('unhandledrejection', e => errs.push('iframe reject: ' + (e.reason && e.reason.message || e.reason)));

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, what, ms = 12000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = fn(); if (v) return v; await sleep(70); }
  throw new Error('timeout waiting for ' + what);
}
const $ = id => win.document.getElementById(id);
const visible = el => el && !el.hidden;

async function main() {
  await until(() => win.document.readyState === 'complete' && $('lib-list'),
              'module app boot');
  await sleep(300);
  log('shell booted on #/signs deep link');

  /* --- signs sheet must show the honest older-wrap banner after /bank 404 */
  await until(() => visible($('sheet-signs')), 'signs sheet open');
  await until(() => visible($('lib-banner')) &&
              $('lib-banner-t').textContent.includes('older wrap'),
              'older-wrap banner');
  log('signs sheet: "older wrap" banner on /bank 404');

  /* --- teach sheet must refuse honestly, not fake a wizard --- */
  $('tray-teach').click();
  await until(() => visible($('sheet-teach')), 'teach sheet open');
  $('tw-name').value = 'wont work';
  $('tw-name').dispatchEvent(new win.Event('input', { bubbles: true }));
  await until(() => !$('tw-name-next').disabled, 'name accepted');
  $('tw-name-next').click();
  await until(() => ($('tw-name-err').textContent || '').includes('older wrap'),
              'teach older-wrap refusal');
  log('teach sheet: "older wrap" refusal (no fake wizard)');

  /* --- composer still sends on an old daemon --- */
  $('tray-compose').click();
  await until(() => $('box') && !visible($('sheet-teach')),
              'back to composer');
  $('box').value = 'old daemon hi';
  $('box').dispatchEvent(new win.Event('input', { bubbles: true }));
  $('go').click();
  await until(() => /into stub window/i.test(
      ($('toast') || {}).textContent || ''), 'send toast');
  log('composer still sends on an old daemon');

  finish(errs.length === 0, errs);
}

function finish(pass, errs) {
  const out = { pass, errs, steps };
  resEl.textContent = pass ? 'OLDTEST PASS' : 'OLDTEST FAIL — ' + (errs[0] || 'see log');
  resEl.style.color = pass ? '#15803d' : '#b91c1c';
  document.title = resEl.textContent;
  fetch('/_result?f=old', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(out) }).catch(() => {});
}
main().catch(e => { errs.push(e.message); log('FAIL ' + e.message); finish(false, errs); });
</script>
</body></html>
