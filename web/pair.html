<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6f8fb">
<title>wispr wrap — pair</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:Inter,ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#f6f8fb; color:#0f172a;
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; padding:28px;
  }
  .card {
    width:100%; max-width:340px; display:flex; flex-direction:column; gap:22px;
    background:#fff; border:1px solid #e7ecf3; border-radius:22px;
    padding:34px 26px 28px;
    box-shadow:0 1px 2px rgba(35,45,80,.05), 0 10px 28px rgba(35,45,80,.10);
  }
  h1 {
    font-size:17px; font-weight:700; letter-spacing:-.01em;
    color:#0f172a; text-align:center;
  }
  h1 span { color:#94a3b8; font-weight:500; }
  .sub { font-size:12px; color:#94a3b8; text-align:center; margin-top:-14px; letter-spacing:.02em; }
  input {
    width:100%; background:#fff; color:#0f172a; font:inherit; font-size:14.5px;
    border:1px solid #e7ecf3; border-radius:12px; padding:12px 13px; outline:none;
    letter-spacing:.02em; transition:border-color .15s, box-shadow .15s;
  }
  input:focus { border-color:#4a7dff; box-shadow:0 0 0 3px rgba(74,125,255,.14); }
  input::placeholder { color:#94a3b8; }
  input.code { letter-spacing:.4em; font-size:16px; text-align:center; font-weight:600; }
  button {
    margin-top:2px; padding:13px; cursor:pointer; font:inherit; font-size:14px; font-weight:600;
    letter-spacing:.01em;
    background:#4a7dff; color:#fff; border:none; border-radius:12px;
    box-shadow:0 4px 14px rgba(74,125,255,.3);
    transition:transform .12s, opacity .15s;
  }
  button:active { transform:scale(.97); opacity:.9; }
  .err { min-height:15px; font-size:12px; color:#cd4b47; text-align:center; letter-spacing:.01em; }
  .hint { font-size:11.5px; color:#94a3b8; text-align:center; line-height:1.8; letter-spacing:.01em; }
  .hint code { color:#64748b; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px;
    background:#f0f4fe; padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
  <div class="card">
    <h1>wispr<span>wrap</span></h1>
    <div class="sub">pair with your laptop</div>
    <input id="addr" placeholder="laptop address — 10.0.0.2:8741" inputmode="url" autocapitalize="none" autocorrect="off" autocomplete="off">
    <input id="code" class="code" placeholder="CODE" maxlength="8" autocapitalize="characters" autocorrect="off" autocomplete="off">
    <button id="go">connect</button>
    <div class="err" id="err"></div>
    <div class="hint">address + code are printed by <code>wrap start</code><br>
      usb cable? run <code>wrap bridge</code> — the app then pairs itself<br>
      or scan the qr with your camera app instead</div>
  </div>
<script>
const err=document.getElementById('err'), addr=document.getElementById('addr'),
      code=document.getElementById('code');
const bad=m=>{ err.textContent=m; };

function finish(url,key){
  err.textContent='paired';
  try{ window.WF && window.WF.pairOk(url,key); }
  catch(e){ location.href=url+'?k='+encodeURIComponent(key); }
}

document.getElementById('go').onclick=async()=>{
  err.textContent='';
  let a=addr.value.trim(); if(!a) return bad('enter the address shown by wrap start');
  if(!/^https?:\/\//.test(a)) a='http://'+a;
  if(!a.endsWith('/')) a+='/';
  try{
    const r=await fetch(a+'pair',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code.value.trim()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.key) return finish(a,j.key);
    bad(r.status===429?'slow down — one try a second':
        r.status===403?'wrong code — see wrap start output':'not a wrap daemon ('+r.status+')');
  }catch(e){ bad('cannot reach '+a.replace(/\/$/,'')); }
};
code.addEventListener('keydown',e=>{ if(e.key==='Enter')document.getElementById('go').click(); });
addr.focus();
</script>
</body>
</html>
