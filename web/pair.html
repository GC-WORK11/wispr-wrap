<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fafaf9">
<title>Sign-Flow</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; background:#fafaf9; color:#111;
    display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:28px;
  }
  .card { width:100%; max-width:380px; display:flex; flex-direction:column; align-items:stretch; gap:14px; text-align:center; }
  .mark { width:44px; height:44px; color:#c2185b; margin:0 auto 14px; }
  h1 { font-size:30px; line-height:1.12; font-weight:600; letter-spacing:-.03em; color:#111; }
  h1 span { color:#6b6b6b; font-weight:500; }
  .sub { font-size:16px; color:#6b6b6b; line-height:1.5; margin:-4px 0 12px; }
  input {
    width:100%; background:#fff; color:#111; font:inherit; font-size:17px; border:1px solid #e7e5e4; border-radius:16px;
    padding:16px 18px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input:focus { border-color:#111; box-shadow:0 0 0 4px rgba(0,0,0,.06); }
  input::placeholder { color:#a3a3a3; }
  input.code { letter-spacing:.4em; font-size:20px; text-align:center; font-weight:600; }
  button {
    margin-top:4px; height:54px; cursor:pointer; font:inherit; font-size:16px; font-weight:600; background:#111; color:#fff;
    border:none; border-radius:27px; transition:transform .12s, opacity .15s;
  }
  button:active { transform:scale(.97); opacity:.9; }
  .err { min-height:20px; font-size:14px; color:#c2301f; }
  .hint { font-size:13px; color:#a3a3a3; line-height:1.8; margin-top:6px; }
  .hint code { color:#3a3a3a; font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12px; background:#f1f0ef; padding:2px 7px; border-radius:6px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>
    <h1>Connect your laptop</h1>
    <div class="sub">Enter the address and code your laptop is showing.</div>
    <input id="addr" placeholder="Laptop address, e.g. 10.0.0.2:8741" inputmode="url" autocapitalize="none" autocorrect="off" autocomplete="off">
    <input id="code" class="code" placeholder="Code" maxlength="8" autocapitalize="characters" autocorrect="off" autocomplete="off">
    <button id="go">Connect</button>
    <div class="err" id="err"></div>
    <div class="hint">The address and code are printed by <code>wrap start</code>.<br>
      Or scan the QR code with your camera.</div>
  </div>
<script>
const err=document.getElementById('err'), addr=document.getElementById('addr'),
      code=document.getElementById('code');
const bad=m=>{ err.textContent=m; };

function finish(url,key){
  err.textContent='paired';
  var bridged=false;
  try{ bridged=!!(window.WF&&window.WF.pairOk&&window.WF.pairOk(url,key)); }
  catch(e){ bridged=false; }
  if(!bridged) location.href=url+'?k='+encodeURIComponent(key);
}

document.getElementById('go').onclick=async()=>{
  err.textContent='';
  let a=addr.value.trim(); if(!a) return bad('enter the address shown by wrap start');
  if(!/^https?:\/\//.test(a)) a='http://'+a;
  if(!a.endsWith('/')) a+='/';
  try{
    const r=await fetch(a+'pair',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:code.value.trim()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.key) return finish(a,j.key);
    bad(r.status===429?'slow down — one try a second':
        r.status===403?'wrong code — see wrap start output':'not a wrap daemon ('+r.status+')');
  }catch(e){ bad('cannot reach '+a.replace(/\/$/,'')); }
};
code.addEventListener('keydown',e=>{ if(e.key==='Enter')document.getElementById('go').click(); });
addr.focus();
</script>
</body>
</html>
