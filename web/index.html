<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f8fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wispr Wrap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wispr Wrap — Flow Composer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/compose.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/teach.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/library.css">
</head>
<body>
  <!-- status strip: laptop link, focused window, live state — always visible -->
  <header class="statusbar" id="statusbar">
    <span class="dot" id="link-dot" aria-hidden="true"></span>
    <span class="statusbar-text" id="status-text">connecting…</span>
    <span class="statusbar-live" id="status-live" hidden>listening</span>
  </header>

  <!-- compose view: the always-on surface -->
  <main class="stage" id="stage">
    <div class="pill" id="pill">
      <div class="attach" id="attach" hidden>
        <img id="thumb" alt="">
        <video id="vthumb" muted playsinline preload="metadata" style="display:none"></video>
        <span class="aname" id="aname"></span>
        <button class="x" id="unattach" aria-label="Remove attachment">×</button>
      </div>
      <div class="row">
        <button class="iconbtn" id="plus" aria-label="Attach image, video or file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <textarea id="box" rows="1" placeholder="Wispr Wrap" autocomplete="off"
                  autocorrect="off" autocapitalize="sentences" enterkeyhint="send"></textarea>
        <input id="file" type="file" accept="image/*,video/*" style="display:none">
        <input id="fileany" type="file" style="display:none">
        <button class="go" id="go" aria-label="Send to laptop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="tray">
        <button class="traybtn" id="tray-live" aria-label="Live sign control">
          <span class="traydot" id="live-dot"></span>LIVE
        </button>
        <button class="traybtn" id="tray-teach">teach a sign</button>
        <button class="traybtn" id="tray-signs">signs</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <!-- sheets: live / teach / library mount into these -->
  <section class="sheet" id="sheet-live" hidden aria-label="Live sign control"></section>
  <section class="sheet" id="sheet-teach" hidden aria-label="Teach a sign"></section>
  <section class="sheet" id="sheet-signs" hidden aria-label="Sign library"></section>
  <section class="sheet sheet-lower" id="sheet-actions" hidden aria-label="Pick an action"></section>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/compose.js"></script>
<script type="module" src="js/pose.js"></script>
<script type="module" src="js/skeleton.js"></script>
<script type="module" src="js/live.js"></script>
<script type="module" src="js/actions.js"></script>
<script type="module" src="js/teach.js"></script>
<script type="module" src="js/library.js"></script>
</body>
</html>
