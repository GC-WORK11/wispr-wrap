<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#fafaf9">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wispr Wrap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Wispr Wrap</title>
<style>
/* loading screen: inline so it paints before any stylesheet. The lotus blooms petal by petal; app.js dissolves it once the page is ready. */
#boot{position:fixed;inset:0;z-index:100;background:#fafaf9;display:grid;place-items:center;transition:opacity .55s ease,visibility .55s;animation:boot-fail .01s 7s forwards}
#boot.done{opacity:0;visibility:hidden}
#boot .bp{transform-box:view-box;transform-origin:32px 46px;opacity:0;animation:bp-in .7s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
#boot .bc{stroke-dasharray:60;stroke-dashoffset:60;animation:bc-in .6s ease .4s forwards}
@keyframes bp-in{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}
@keyframes bc-in{to{stroke-dashoffset:0}}
@keyframes boot-fail{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#boot .bp,#boot .bc{animation-duration:.01s;animation-delay:0s}}
</style>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/compose.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/teach.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/macro.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/panes.css">
<link rel="stylesheet" href="css/drawer.css">
<link rel="stylesheet" href="css/packs.css">
<link rel="stylesheet" href="css/boot.css">
<!-- BOOT stage: critical splash styles, inline so the loading screen paints
     before any stylesheet loads (zero layout shift, no flash of blank page). -->
<style>
#boot .boot-mark{width:72px;height:72px;color:#c2185b;display:block}
#boot .boot-word{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
system-ui,sans-serif;font-weight:600;font-size:19px;letter-spacing:.2px;color:#111;margin:0}
#boot .boot-bar{width:128px;height:2px;border-radius:2px;background:rgba(17,17,17,.09);
overflow:hidden;position:relative;margin-top:18px}
#boot .boot-bar>i{position:absolute;inset:0 auto 0 0;width:100%;border-radius:2px;
background:#c2185b;transform:scaleX(var(--boot-p,.06));transform-origin:left center}
</style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="96" height="96" focusable="false">
      <g class="bp" style="--d:.22s"><path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(-58 32 46) translate(32 46) scale(.82) translate(-32 -46)" fill="#E91E63"/></g>
      <g class="bp" style="--d:.22s"><path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(58 32 46) translate(32 46) scale(.82) translate(-32 -46)" fill="#E91E63"/></g>
      <g class="bp" style="--d:.12s"><path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(-30 32 46)" fill="#D81B60"/></g>
      <g class="bp" style="--d:.12s"><path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(30 32 46)" fill="#D81B60"/></g>
      <g class="bp" style="--d:.02s"><path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" fill="#C2185B"/></g>
      <path class="bc" d="M15 51.5C22 58.5 42 58.5 49 51.5" fill="none" stroke="#C2185B" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="boot-bar"><i></i></div>
  </div>
  <script src="js/boot.js"></script>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="wl-mark" viewBox="0 0 64 64">
    <path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(-58 32 46) translate(32 46) scale(.82) translate(-32 -46)" fill="#E91E63"/>
    <path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(58 32 46) translate(32 46) scale(.82) translate(-32 -46)" fill="#E91E63"/>
    <path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(-30 32 46)" fill="#D81B60"/>
    <path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" transform="rotate(30 32 46)" fill="#D81B60"/>
    <path d="M32 7C38 15 40.5 26 32 46C23.5 26 26 15 32 7Z" fill="#C2185B"/>
    <path d="M15 51.5C22 58.5 42 58.5 49 51.5" fill="none" stroke="#C2185B" stroke-width="3" stroke-linecap="round"/>
  </symbol></svg>
  <!-- the ASCII lotus: three tiers of one deep-pink gradient -->
  <div class="field" id="field" aria-hidden="true"><pre id="f0"></pre><pre id="f1"></pre><pre id="f2"></pre><pre id="f3"></pre><pre id="f4"></pre></div>

  <header class="top">
    <button class="hamb" id="menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"/></svg>
    </button>
  </header>

  <main class="view" id="view">
    <div class="stage" id="stage">
      <button class="conn-hint" id="conn-hint" hidden><i></i><span>Connect your laptop</span></button>
      <div class="composer" id="composer">
        <button class="plusbtn" id="plus" aria-label="Attach image, video or file" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <div class="pill" id="pill">
          <div id="confirms" hidden></div>
          <div class="attach" id="attach" hidden>
            <img id="thumb" alt="">
            <video id="vthumb" muted playsinline preload="metadata" style="display:none"></video>
            <span class="aname" id="aname"></span>
            <button class="x" id="unattach" aria-label="Remove attachment">×</button>
          </div>
          <div class="row">
            <textarea id="box" rows="1" placeholder="Wispr Wrap" autocomplete="off"
                      autocorrect="off" autocapitalize="sentences" enterkeyhint="send" aria-label="Message"></textarea>
            <input id="file" type="file" accept="image/*,video/*" style="display:none">
            <input id="fileany" type="file" style="display:none">
            <span class="act" id="act">
              <!-- one black pill: the waveform (Go Live) flows into the send arrow as soon as there is text, and back when empty -->
              <svg class="act-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                <line class="b1" x1="4.5" y1="10" x2="4.5" y2="14"/><line class="b2" x1="8.5" y1="7" x2="8.5" y2="17"/><line class="b3" x1="12.5" y1="4" x2="12.5" y2="20"/><line class="b4" x1="16.5" y1="8" x2="16.5" y2="16"/><line class="b5" x1="20.5" y1="10.5" x2="20.5" y2="13.5"/>
              </svg>
              <button class="live-btn" id="tray-live" aria-label="Go Live"></button>
              <button class="go" id="go" aria-label="Send to laptop" tabindex="-1"></button>
            </span>
          </div>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>

    <section class="sheet" id="sheet-live" hidden aria-label="Go Live"></section>
    <section class="sheet" id="sheet-teach" hidden aria-label="Teach a sign"></section>
    <section class="sheet" id="sheet-signs" hidden aria-label="My signs"></section>
    <section class="sheet" id="sheet-laptop" hidden aria-label="Laptop"></section>
    <section class="sheet" id="sheet-settings" hidden aria-label="Settings"></section>
  </main>

  <!-- hamburger sidebar -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
    <div class="dr-head">
      <span class="dr-brand">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#wl-mark"/></svg>
        Wispr Wrap
      </span>
      <button class="dr-x" id="dr-close" aria-label="Close menu">×</button>
    </div>
    <nav class="dr-nav" id="drawer-nav">
      <button class="dr-item" id="dr-connect" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        <span class="dr-t">Connect your laptop</span>
      </button>
      <button class="dr-item" id="tray-teach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 11.5V6a1.5 1.5 0 0 1 3 0v5m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v1m0-.5a1.5 1.5 0 0 1 3 0v4.5c0 3-2.5 5.5-6 5.5s-5-1.5-6.5-4l-2-3.6c-.6-1 .8-2.1 1.7-1.3l1.3 1.1"/></svg>
        <span class="dr-t">Teach a sign</span>
      </button>
      <button class="dr-item" id="tray-signs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="dr-t">My signs</span>
        <span class="dr-count" id="rail-count"></span>
      </button>
      <button class="dr-item" id="dr-laptop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>
        <span class="dr-t">Laptop<span class="dr-sub" id="dr-laptop-s">Checking…</span></span>
        <i class="dr-dot" id="link-dot"></i>
      </button>
      <button class="dr-item" id="dr-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span class="dr-t">Settings</span>
      </button>
    </nav>
  </aside>

  <!-- first run: connect to the laptop (shown only when there is no valid key) -->
  <div class="onb" id="onb" hidden>
    <div class="onb-in">
      <svg class="onb-mark" viewBox="0 0 64 64" aria-hidden="true"><use href="#wl-mark"/></svg>
      <label class="onb-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>
        <input class="onb-code" id="onb-code" maxlength="8" placeholder="········" inputmode="text"
               autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Laptop pairing code">
      </label>
      <button class="btn btn-primary" id="onb-go">Connect</button>
      <div class="onb-err" id="onb-err" role="alert"></div>
      <button class="onb-skip" id="onb-skip" hidden>Not now</button>
    </div>
  </div>

  <!-- pickers overlay everything -->
  <section class="sheet sheet-lower" id="sheet-actions" hidden aria-label="Pick an action"></section>
  <section class="sheet sheet-lower" id="sheet-macro" hidden aria-label="Macro and context rules"></section>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/compose.js"></script>
  <script type="module" src="js/pose.js"></script>
  <script type="module" src="js/skeleton.js"></script>
  <script type="module" src="js/live.js"></script>
  <script type="module" src="js/actions.js"></script>
  <script type="module" src="js/macro.js"></script>
  <script type="module" src="js/panes.js"></script>
  <script type="module" src="js/teach.js"></script>
  <script type="module" src="js/library.js"></script>
  <script type="module" src="js/laptop.js"></script>
  <script type="module" src="js/settings.js"></script>
  <script type="module" src="js/drawer.js"></script>
  <script type="module" src="js/sound.js"></script>
</body>
</html>
