<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f8fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wispr Wrap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Wispr Wrap — Flow Composer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/compose.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/teach.css">
<link rel="stylesheet" href="css/actions.css">
<link rel="stylesheet" href="css/macro.css">
<link rel="stylesheet" href="css/library.css">
</head>
<body>
<div class="shell">
  <!-- sidebar: brand, laptop link, the Go Live hero, feature nav -->
  <aside class="rail" id="rail">
    <div class="rail-top">
      <div class="brand">wispr<span class="brand-b">wrap</span></div>
      <div class="rail-status">
        <span class="dot" id="link-dot" aria-hidden="true"></span>
        <span class="rail-status-t" id="status-text">connecting…</span>
      </div>
    </div>

    <button class="golive" id="tray-live" aria-label="Go Live — sign control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 11.5V6a1.5 1.5 0 0 1 3 0v5m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v1m0-.5a1.5 1.5 0 0 1 3 0v4.5c0 3-2.5 5.5-6 5.5s-5-1.5-6.5-4l-2-3.6c-.6-1 .8-2.1 1.7-1.3l1.3 1.1"/>
      </svg>
      <span>Go Live</span>
      <span class="golive-sub" id="golive-sub">sign → laptop acts</span>
    </button>

    <nav class="rail-nav" aria-label="Sections">
      <button class="railitem" id="tray-compose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span>compose</span>
      </button>
      <button class="railitem" id="tray-teach">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>teach a sign</span>
      </button>
      <button class="railitem" id="tray-signs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>your signs</span>
      </button>
    </nav>

    <div class="rail-foot">
      <span class="rail-live" id="status-live" hidden><i></i>listening</span>
      <span class="rail-eng" id="rail-eng"></span>
    </div>
  </aside>

  <!-- main area: compose by default; live/teach/signs mount here -->
  <main class="view" id="view">
    <div class="stage" id="stage">
      <div class="pill" id="pill">
        <div id="confirms" hidden></div>
        <div class="attach" id="attach" hidden>
          <img id="thumb" alt="">
          <video id="vthumb" muted playsinline preload="metadata" style="display:none"></video>
          <span class="aname" id="aname"></span>
          <button class="x" id="unattach" aria-label="Remove attachment">×</button>
        </div>
        <div class="row">
          <button class="iconbtn" id="plus" aria-label="Attach image, video or file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <textarea id="box" rows="1" placeholder="Type or dictate — it lands at the laptop cursor" autocomplete="off"
                    autocorrect="off" autocapitalize="sentences" enterkeyhint="send"></textarea>
          <input id="file" type="file" accept="image/*,video/*" style="display:none">
          <input id="fileany" type="file" style="display:none">
          <button class="go" id="go" aria-label="Send to laptop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <section class="sheet" id="sheet-live" hidden aria-label="Live sign control"></section>
    <section class="sheet" id="sheet-teach" hidden aria-label="Teach a sign"></section>
    <section class="sheet" id="sheet-signs" hidden aria-label="Sign library"></section>
  </main>
</div>

<!-- pickers overlay everything -->
<section class="sheet sheet-lower" id="sheet-actions" hidden aria-label="Pick an action"></section>
<section class="sheet sheet-lower" id="sheet-macro" hidden aria-label="Macro and context rules"></section>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/compose.js"></script>
<script type="module" src="js/pose.js"></script>
<script type="module" src="js/skeleton.js"></script>
<script type="module" src="js/live.js"></script>
<script type="module" src="js/actions.js"></script>
<script type="module" src="js/macro.js"></script>
<script type="module" src="js/teach.js"></script>
<script type="module" src="js/library.js"></script>
</body>
</html>
